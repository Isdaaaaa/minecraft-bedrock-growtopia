[plugin]
name = "Terravia"
version = "0.1.0"
api_version = "0.5"
description = "Growtopia-like dynamic world system for Terravia — shard-based dimensions, per-world isolation"
authors = ["Isdaaaaa"]
website = "https://github.com/Isdaaaaa/minecraft-bedrock-growtopia"
load = "POSTWORLD"

[commands]
  [commands.join]
  description = "Enter or create a Terravia world by name"
  usages = ["/join <world name>"]
  aliases = ["j"]
  permissions = ["terravia.world.join"]

  [commands.world]
  description = "Manage your current world (lock, kick, ban, info, etc.)"
  usages = ["/world <leave|info|lock|kick|ban|unban|add|remove>"]
  aliases = ["tw", "w"]

  [commands.wadmin]
  description = "Terravia admin commands"
  usages = ["/wadmin <shards|tp <world>>"]
  permissions = ["terravia.admin"]

[permissions]
  [permissions."terravia.world.join"]
  description = "Allows player to join and create worlds"
  default = true

  [permissions."terravia.admin"]
  description = "Full admin access to Terravia systems"
  default = "op"
